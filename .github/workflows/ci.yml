name: CI

on:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:all
      - run: pnpm test:all
      - run: pnpm build:all

  runtime:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DB_PASS: ci-local-only-password
      DATABASE_URL: postgres://bright:ci-local-only-password@localhost:5432/bright_memo
      APP_DATABASE_URL: postgres://bright_app:ci-app-only-password@localhost:5432/bright_memo
      SERVICE_DATABASE_URL: postgres://bright_service:ci-service-only-password@localhost:5432/bright_memo
      BOOTSTRAP_TOKEN_SECRET: ci-only-bootstrap-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL
        run: docker compose -f docker/docker-compose.yml up -d --wait
      - name: Deploy database
        run: pnpm db:deploy
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t bright-memo-api:v0.2.1 .
      - name: Start API image
        run: |
          docker run -d --name bright-memo-api \
            --network bright-memo-db_default \
            -p 127.0.0.1:3001:3001 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://bright:ci-local-only-password@db:5432/bright_memo \
            -e APP_DATABASE_URL=postgres://bright_app:ci-app-only-password@db:5432/bright_memo \
            -e SERVICE_DATABASE_URL=postgres://bright_service:ci-service-only-password@db:5432/bright_memo \
            -e BOOTSTRAP_TOKEN_SECRET="$BOOTSTRAP_TOKEN_SECRET" \
            -e APP_URL=http://localhost:3000 \
            bright-memo-api:v0.2.1
      - name: Smoke API image
        run: |
          for attempt in $(seq 1 40); do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3001/health || printf '000')
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          test "$status" = "200"
          grep -q '"db":"up"' /tmp/health.json
          test "$(curl -sS -o /tmp/me.json -w '%{http_code}' http://127.0.0.1:3001/v1/me)" = "401"
      - name: Run E2E gate against API image
        env:
          E2E_API_URL: http://127.0.0.1:3001
        run: pnpm exec tsx scripts/e2e-gate.ts
      - name: Verify graceful shutdown
        run: |
          docker stop --timeout 10 bright-memo-api
          test "$(docker inspect -f '{{.State.ExitCode}}' bright-memo-api)" = "0"
          docker logs bright-memo-api > /tmp/bright-memo-api.log 2>&1
          grep -q 'shutting down' /tmp/bright-memo-api.log
          ! grep -q 'ERR_MODULE_NOT_FOUND.*@bright-memo/shared' /tmp/bright-memo-api.log
      - name: Cleanup
        if: always()
        run: |
          container_id=$(docker ps -aq --filter name=^/bright-memo-api$)
          if [ -n "$container_id" ]; then docker rm -f "$container_id"; fi
          docker compose -f docker/docker-compose.yml down -v
