# ---------------------------------------------------------------------------
# Bright Memo v2 — Postgres tuning (v1, conservative defaults)
# Mounted at /etc/postgresql/postgresql.conf via docker-compose command.
# ---------------------------------------------------------------------------

listen_addresses = 'localhost'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# Memory
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 128MB
huge_pages = try

# WAL
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
logging_collector = on
log_destination = 'stderr'
log_min_duration_statement = 500
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a '

# Locale / encoding
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Extensions are loaded via /docker-entrypoint-initdb.d/*.sql
# (vector extension lives there for pgvector)